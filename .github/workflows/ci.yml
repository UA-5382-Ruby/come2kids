name: CI

# No `paths:` filter on purpose: `lint` is a required status check, and a skipped
# required check stays "pending" forever and blocks the pull request.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true

      - name: Lint code for consistent style
        run: bundle exec rubocop --format github
