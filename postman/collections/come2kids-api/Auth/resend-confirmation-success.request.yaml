$kind: http-request
name: 'Resend Confirmation - Success'
method: POST
url: '{{base_url}}/api/v1/auth/resend-confirmation'
order: 7000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{registered_user_email}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response contains a message", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("message").that.is.a("string").and.not.empty;
      });

      pm.test("Response does not reveal whether the email exists", function () {
        // The API intentionally returns the same shape regardless of whether the email is registered
        const json = pm.response.json();
        pm.expect(Object.keys(json)).to.have.members(["message"]);
      });
