$kind: http-request
name: 'Resend Confirmation - Missing Email'
method: POST
url: '{{base_url}}/api/v1/auth/resend-confirmation'
order: 8000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400 Bad Request", function () {
        pm.response.to.have.status(400);
      });

      pm.test("Error code is PARAMETER_MISSING", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("code", "PARAMETER_MISSING");
      });

      pm.test("Details mention the email field", function () {
        const json = pm.response.json();
        pm.expect(json.details).to.be.an("array").that.is.not.empty;
        const emailError = json.details.find(function (d) { return d.field === "email"; });
        pm.expect(emailError, "expected a missing-parameter error for field 'email'").to.exist;
      });
