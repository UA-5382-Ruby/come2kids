name: Lint

on:
  pull_request:

jobs:
  rubocop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: api
      - run: bundle exec rubocop