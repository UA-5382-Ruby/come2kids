# Local development overrides — merged automatically with compose.yaml when you run:
#   docker compose up -d --build
#
# Production (skip this file):
#   docker compose -f compose.yaml up -d --build

x-api-env-dev: &api-env-dev
  RAILS_ENV: ${RAILS_ENV:-production}
  RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-debug}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  DB_HOST: db
  DB_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-come2kids_development}
  POSTGRES_CACHE_DB: ${POSTGRES_DB:-come2kids_development}
  POSTGRES_CABLE_DB: ${POSTGRES_DB:-come2kids_development}
  POSTGRES_USER: ${POSTGRES_USER:-come2kids}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-come2kids}
  API_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-come2kids}
  REDIS_URL: redis://redis:6379/0
  MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/come2kids_development}
  MAIL_FROM: ${MAIL_FROM:-noreply@come2kids.local}
  SMTP_ADDRESS: mailpit
  SMTP_PORT: "1025"
  SMTP_DOMAIN: localhost
  SMTP_ENABLE_STARTTLS_AUTO: "false"
  APP_HOST: ${APP_HOST:-localhost}
  APP_PROTOCOL: ${APP_PROTOCOL:-http}
  SIDEKIQ_USERNAME: ${SIDEKIQ_USERNAME:-sidekiq}
  SIDEKIQ_PASSWORD: ${SIDEKIQ_PASSWORD:-sidekiq}
  SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-5}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-Come2KidsDevPrimaryKeyChangeMe12}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-Come2KidsDevDeterministicKeyChg}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-Come2KidsDevKeyDerivationSalt12}

services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-come2kids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-come2kids}
      POSTGRES_DB: ${POSTGRES_DB:-come2kids_development}
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mongo:
    ports:
      - "${MONGO_PORT:-27017}:27017"

  api:
    environment:
      <<: *api-env-dev
    ports:
      - "${API_PORT:-3000}:80"

  sidekiq:
    environment:
      <<: *api-env-dev

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
