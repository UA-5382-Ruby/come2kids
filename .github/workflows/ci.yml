name: CI

# No `paths:` filter on purpose: `lint` is a required status check, and a skipped
# required check stays "pending" forever and blocks the pull request.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          working-directory: api
          bundler-cache: true

      - name: Lint code for consistent style
        run: bundle exec rubocop --format github
