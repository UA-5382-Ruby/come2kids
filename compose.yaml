# Base / production stack for Come2Kids.
#
# Production (this file only — override defaults via .env):
#   docker compose -f compose.yaml --env-file .env.production up -d --build
#
# Local development (auto-merges compose.override.yaml):
#   docker compose up -d --build
#
# Solid Cache / Solid Cable reuse the primary Postgres DB via POSTGRES_CACHE_DB /
# POSTGRES_CABLE_DB (no extra databases or init scripts).

x-api-env: &api-env
  RAILS_ENV: ${RAILS_ENV:-production}
  RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:-change-me-in-production-use-rails-secret}
  DB_HOST: db
  DB_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-come2kids_production}
  POSTGRES_CACHE_DB: ${POSTGRES_CACHE_DB:-${POSTGRES_DB:-come2kids_production}}
  POSTGRES_CABLE_DB: ${POSTGRES_CABLE_DB:-${POSTGRES_DB:-come2kids_production}}
  POSTGRES_USER: ${POSTGRES_USER:-come2kids}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-come2kids}
  API_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-come2kids}
  REDIS_URL: redis://redis:6379/0
  MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/come2kids_production}
  MAIL_FROM: ${MAIL_FROM:-noreply@come2kids.local}
  SMTP_ADDRESS: ${SMTP_ADDRESS:-localhost}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_DOMAIN: ${SMTP_DOMAIN:-}
  SMTP_USER_NAME: ${SMTP_USER_NAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-plain}
  SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-true}
  APP_HOST: ${APP_HOST:-localhost}
  APP_PROTOCOL: ${APP_PROTOCOL:-https}
  SIDEKIQ_USERNAME: ${SIDEKIQ_USERNAME:-sidekiq}
  SIDEKIQ_PASSWORD: ${SIDEKIQ_PASSWORD:-sidekiq}
  SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-5}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-Come2KidsProdPrimaryKeyChangeMe!!}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-Come2KidsProdDeterministic!!}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-Come2KidsProdSaltChangeMe!!!}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-come2kids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-come2kids}
      POSTGRES_DB: ${POSTGRES_DB:-come2kids_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  sidekiq:
    build:
      context: ./api
    restart: unless-stopped
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  mongo_data:
