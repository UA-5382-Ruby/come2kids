$kind: http-request
name: 'Health Check'
method: GET
url: '{{base_url}}/up'
order: 1000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Health check returns 200 OK", function () {
        pm.response.to.have.status(200);
      });
