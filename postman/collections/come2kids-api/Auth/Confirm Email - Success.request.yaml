$kind: http-request
url: "{{base_url}}/api/v1/auth/confirm-email"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400 Bad Request", function () {
        pm.response.to.have.status(400);
      });

      pm.test("Error code is PARAMETER_MISSING", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("code", "PARAMETER_MISSING");
      });

      pm.test("Response has an error message", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("message").that.is.a("string").and.not.empty;
      });

      pm.test("Details mention the token field", function () {
        const json = pm.response.json();
        pm.expect(json.details).to.be.an("array").that.is.not.empty;
        const tokenError = json.details.find(function (d) { return d.field === "token"; });
        pm.expect(tokenError, "expected a missing-parameter error for field 'token'").to.exist;
      });
    language: text/javascript
order: 5947
