# Local development overrides — merged automatically with compose.yaml when you run:
#   cp .env.example .env
#   docker compose up -d --build
#
# Production (skip this file):
#   docker compose -f compose.yaml --env-file .env.production up -d --build
#
# App/secrets live in root .env (from .env.example). This file only publishes
# ports and adds Mailpit.

services:
  db:
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mongo:
    ports:
      - "${MONGO_PORT:-27017}:27017"

  api:
    ports:
      - "${API_PORT:-3000}:80"

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
