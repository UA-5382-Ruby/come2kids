$kind: http-request
name: 'Register - Weak Password'
method: POST
url: '{{base_url}}/api/v1/auth/register'
order: 3000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{test_email}}",
      "password": "password",
      "password_confirmation": "password",
      "first_name": "Test",
      "last_name": "User",
      "preferred_locale": "en"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Unique email so the only validation error is the password complexity rule
      pm.environment.set("test_email", "weakpw_" + Date.now() + "@example.com");
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 422 Unprocessable Entity", function () {
        pm.response.to.have.status(422);
      });

      pm.test("Error code is VALIDATION_ERROR", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("code", "VALIDATION_ERROR");
      });

      pm.test("Details array contains a password complexity error", function () {
        const json = pm.response.json();
        pm.expect(json.details).to.be.an("array").that.is.not.empty;
        const passwordError = json.details.find(function (d) { return d.field === "password"; });
        pm.expect(passwordError, "expected a validation error for field 'password'").to.exist;
      });
