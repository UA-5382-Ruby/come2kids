# Recurring jobs (sidekiq-cron).
# Used later for reminders, reservation expiry and payment status checks.
# Uncomment / add entries when those jobs exist.
#
# example_heartbeat:
#   cron: "0 * * * *"
#   class: "ExampleHeartbeatJob"
#   queue: default
#   description: "Hourly heartbeat to verify the scheduler is running"

example_heartbeat:
  cron: "0 * * * *"
  class: "ExampleHeartbeatJob"
  queue: low
  description: "Hourly heartbeat to verify the scheduler is running"

release_expired_reservations:
  cron: "* * * * *"
  class: "ReleaseExpiredReservationsJob"
  queue: default
  description: "Release expired unpaid ticket reservations every minute"

emails_process_outbox:
  cron: "* * * * *"
  class: "Emails::ProcessOutboxJob"
  queue: mailers
  description: "Every minute: enqueue missing purchase emails and deliver due outbox rows"