plugins:
  - rubocop-rails

AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - bin/**/*
    - db/*schema.rb
    - vendor/**/*
    - tmp/**/*
    - node_modules/**/*

# Follow the Rails convention used by generated code.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120

# Match .gitattributes (eol=lf). The default "native" expects CRLF when RuboCop runs on Windows.
Layout/EndOfLine:
  EnforcedStyle: lf

Metrics/BlockLength:
  Exclude:
    - config/**/*
